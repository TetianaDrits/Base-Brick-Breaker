<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><title>Base Arcanoid</title>
<style>
  body { background: #000; color: #0052FF; font-family: sans-serif; text-align: center; }
  canvas { background: #111; border: 3px solid #0052FF; }
</style>
</head>
<body>
<h1>Base Gas Breaker</h1>
<canvas id="c" width="400" height="400"></canvas>
<script>
  const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  let x = 200, y = 300, dx = 2, dy = -2, paddleX = 160;
  let bricks = []; for(let c=0; c<5; c++) { bricks[c]=[]; for(let r=0; r<3; r++) bricks[c][r]={x:0,y:0,status:1}; }
  document.addEventListener("mousemove", e => { paddleX = e.clientX - canvas.offsetLeft - 40; });
  function draw() {
    ctx.clearRect(0, 0, 400, 400);
    for(let c=0; c<5; c++) for(let r=0; r<3; r++) if(bricks[c][r].status==1) {
      let bx = c*75+15, by = r*30+30; bricks[c][r].x = bx; bricks[c][r].y = by;
      ctx.fillStyle = "#ff4444"; ctx.fillRect(bx, by, 65, 20);
    }
    ctx.fillStyle = "#00D395"; ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#0052FF"; ctx.fillRect(paddleX, 380, 80, 10);
    for(let c=0; c<5; c++) for(let r=0; r<3; r++) {
      let b = bricks[c][r]; if(b.status==1 && x>b.x && x<b.x+65 && y>b.y && y<b.y+20) { dy = -dy; b.status = 0; }
    }
    if(x + dx > 392 || x + dx < 8) dx = -dx;
    if(y + dy < 8) dy = -dy;
    else if(y + dy > 372) {
      if(x > paddleX && x < paddleX + 80) dy = -dy;
      else { alert("GAME OVER"); document.location.reload(); }
    }
    x += dx; y += dy; requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
